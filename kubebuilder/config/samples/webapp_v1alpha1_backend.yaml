apiVersion: webapp.lab.com/v1alpha1
kind: Website
metadata:
  labels:
    app.kubernetes.io/name: kubebuilder
    app.kubernetes.io/managed-by: kustomize
  name: backend
spec:
  image: backend
  replicas: 1
  host: backend.local
  env:
    # CNPG génère automatiquement le Secret "<cluster>-app" (ici "bdd-app")
    # contenant les identifiants de connexion, dont la clé "uri" au format
    # postgres://user:pass@host:5432/dbname attendue par DATABASE_URL.
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: bdd-app
          key: uri